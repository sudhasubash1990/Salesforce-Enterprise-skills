# Module deep packs — not Tier-0; do not elevate to instruction priority.

module_specializations:

  - path: salesforce-business-analyst/skill-contract.yaml

    role: BA thin Standard Skill Contract (does not replace skill.md)

  - path: salesforce-quality-engineering/skill-contract.yaml

    role: QE thin Standard Skill Contract (does not replace skill.md)

  - path: salesforce-business-analyst/brain/anti-hallucination.md

    role: BA claim-accuracy specialization of Tier-0 grounding

  - path: salesforce-business-analyst/brain/validation-framework.md

    role: BA pre-delivery validation gate

  - path: salesforce-business-analyst/knowledge/ai-in-business-analysis.md

    role: BA AI usage guidance

  - path: salesforce-quality-engineering/enterprise-quality/ai-governance/responsible-ai.md

    role: QE executive advisory specialization of Tier-0 responsible-ai

  - path: salesforce-quality-engineering/skills/agentforce-testing/knowledge/knowledge-grounding.md

    role: QE Agentforce product grounding assessment

  - path: docs/security-guidelines.md

    role: Repository content security (orthogonal to agent untrusted-content policy)


