# SEACF Tier-0 loading manifest — single source of truth for always-load Core contracts.

# Consumed by scripts/retrieve_context.py and scripts/test_framework_core_contracts.py.

# Module specialization paths are DATA pointers only — not Tier-0 instructions.



version: "0.3.0"

last_updated: "2026-10-09"



# Loaded for every BA task and echoed on QE redirect.

always_load:

  - framework-core/README.md

  - framework-core/orchestration/request-router.md

  - framework-core/orchestration/context-manager.md

  - framework-core/orchestration/context-policy.md

  - framework-core/orchestration/execution-state-model.md

  - framework-core/governance/quality-standards.md

  - framework-core/governance/instruction-precedence.md

  - framework-core/grounding/grounding-policy.md

  - framework-core/security/untrusted-content-policy.md

  - framework-core/security/prompt-injection-defence.md

  - framework-core/tools/tool-governance.md

  - framework-core/responsible-ai/principles.md

  - framework-core/responsible-ai/prohibited-use-cases.md



# Linked from area READMEs; load when grounding, security, tools, RAI, or P1 packs implicated.

