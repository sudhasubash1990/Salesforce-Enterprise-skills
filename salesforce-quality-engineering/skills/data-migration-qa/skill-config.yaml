    - Rollback
  intent_keywords:
    - validate
    - review
    - reconcile
    - mapping
    - transformation
    - cutover readiness
    - rollback
    - migration QA
  prefer_over:
    - sprint_4a_data_encyclopedia
    - sova_when_full_migration_lifecycle
  prefer_when: "migration OR ETL OR cutover OR mapping OR transformation + (validate OR reconcile OR readiness)"
  defer_to_sova_when: "pure SOQL reconciliation / write queries only without mapping-cutover lifecycle"
  defer_to_tdg_when: "synthetic seed / factory generation without migration validation intent"
  defer_to_sprint9_when: "general ops Sev1 / non-migration hypercare"

composition:
  upstream:
    - metadata-impact-analyzer
  downstream:
    - soql-validation
    - permission-testing
    - test-data-generator
    - playwright-review
    - omnistudio-qa
    - agentforce-testing
  support:
