    - knowledge/data/data-quality.md
    - knowledge/data/data-loader.md
    - knowledge/data/referential-integrity.md
    - knowledge/data/pii-considerations.md
    - production-support/

output:
  schema_sections: 20
  primary_template: templates/reconciliation-report.md
  strategy_template: templates/data-migration-test-strategy.md
  hard_rules:
    - "Migration Scope + Source/Target Assessment before detailed validation cases"
    - "Do not invent throughput, duration, or SLA percentages"
    - "Do not claim GDPR certification; flag Legal/Compliance"
    - "Do not duplicate knowledge/data encyclopedia body"

folders:
  knowledge: 19
  playbooks: 8
  templates: 9
  prompts: 10
  examples: 10
  tests: 12
