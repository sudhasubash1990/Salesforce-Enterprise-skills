  - persona_identified
  - positive_negative_boundary_covered
  - no_vague_expected_results
  - assumptions_labeled
  - no_invented_coverage_percentages
  - chain_pta_sova_tdg_pwr_when_applicable

escalation:
  - signal: cross_cloud_journey_without_clear_scope
    to: Solution Architect
  - signal: regulatory_compliance_implied
    to: Compliance + Legal advisory
  - signal: experience_cloud_guest_user_security
    to: Security Architect + PTA
